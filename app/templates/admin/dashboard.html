{% extends "base_dashboard.html" %}

{% block content %}
<div class="dashboard-header">
    <h1>📊 Panel de Administración</h1>
    <br>
</div>

<div class="dashboard-grid">
    <div class="card card-primary">
        <div class="card-content">
            <h3 class="card-title">{{ total_usuarios }}</h3>
            <p class="card-text">Usuarios Totales</p>
        </div>
    </div>
</div>


<div class="card-resumen">
    <div class="quick-actions-section">
        <h2>Acciones Rápidas</h2>
        <div class="quick-actions">
            <a href="{{ url_for('admin.registrar_usuario_form') }}" class="btn btn-success">👤 Registrar Nuevo
                Usuario</a>
            <a href="{{ url_for('admin.lista_usuarios') }}" class="btn btn-info">📋 Ver Todos los Usuarios</a>
            <a href="{{ url_for('admin.lista_productos') }}" class="btn btn-info">🍽️ Ver Productos</a>
        </div>
    </div>

    <div class="user-info-card">
        <strong>Usuario actual:</strong> {{ session.user_nombre }} ({{ session.user_email }})
    </div>
</div>
{% endblock %}
