{% extends "base_dashboard.html" %}

{% block content %}
<main class="container">
    <div class="card">
        <div class="card-header">
            <h2><i class="fas fa-box-open"></i> {{ titulo }}</h2>
        </div>
        <div class="card-body">

            {% if producto %}
            <form method="POST" action="#"> 
            {% else %}
            <form method="POST" action="{{ url_for('admin.registrar_producto') }}">
            {% endif %}

                <div class="form-group">
                    <label for="nombre">Nombre del Producto *</label>
                    <input type="text" id="nombre" name="nombre" required 
                           value="{{ producto.nombre if producto else form_data.nombre if form_data else '' }}"
                           placeholder="Ej: Hamburguesa Clásica">
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion" rows="3" 
                              placeholder="Ej: Carne de res, lechuga, tomate y queso cheddar.">{{ producto.descripcion if producto else form_data.descripcion if form_data else '' }}</textarea>
                </div>
                
                <div class="row">
                    <div class="form-group">
                        <label for="precio">Precio de Venta *</label>
                        <input type="number" id="precio" name="precio" min="0" step="0.01" required 
                               value="{{ producto.precio if producto else form_data.precio if form_data else '' }}"
                               placeholder="Ej: 150.00">
                    </div>
                    
                    <div class="form-group">
                        <label for="costo">Costo de Producción</label>
                        <input type="number" id="costo" name="costo" min="0" step="0.01" 
                               value="{{ producto.costo if producto else form_data.costo if form_data else '' }}"
                               placeholder="Ej: 75.00">
                        <small>Costo de los insumos para hacer este producto.</small>
                    </div>
                </div>

                <div class="form-buttons">
                    <a href="{{ url_for('admin.lista_productos') }}" class="btn-secondary">✖️ Cancelar</a>
                    
                    <button type="submit" class="btn-primary">
                        {% if producto %}
                        <i class="fas fa-save"></i> Guardar Cambios
                        {% else %}
                        <i class="fas fa-save"></i> Registrar Producto
                        {% endif %}
                    </button>
                </div>
            </form>
        <div class="mt-3">
    <input type=button value=" ⬅️ Volver" href="#" class="btn-secondary" onclick="history.go (-1)">
</div>
        </div>
    </div>
</main>
{% endblock %}
