{% extends "base_dashboard.html" %}


{% block content %}
  <div class="editar-container">
    <h1>Editar Producto</h1>

    <form class="form-editar">
      <div class="form-group">
        <label for="imagen">Imagen del producto</label>
        <input type="file" id="imagen" name="imagen" accept="image/*">
      </div>

      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" placeholder="Nombre del producto">
      </div>

      <div class="form-group">
        <label for="precio">Precio</label>
        <input type="number" id="precio" name="precio" placeholder="0.00" step="0.01">
      </div>

      <div class="form-group">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" rows="4" placeholder="Descripción del producto"></textarea>
      </div>

      <div class="botones">
        <button type="submit" class="boton">Guardar Cambios</button>
        <button type="button" class="boton cancelar">Cancelar</button>
      </div>
    </form>
  </div>
</body>
</html>
{% endblock %}
